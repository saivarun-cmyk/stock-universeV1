# Trading System Universe - USA Market Configuration
# Kept in a SEPARATE file from config/universe_india.yaml on purpose so
# Indian and US symbols are never mixed together in one scan.
#
# Fields:
#   sector      -> grouping label used for the sidebar Sector filter
#   stock       -> display name / ticker
#   ticker      -> Yahoo Finance symbol (no exchange suffix needed for US
#                  symbols; BRK.A/BRK.B -> BRK-A/BRK-B, COMEX continuous
#                  futures GC1!/SI1! -> GC=F/SI=F for Yahoo compatibility)
#   exchange    -> original listing exchange, for reference only
#   nse_symbol  -> always blank here (NSE / DHAN fallback is India-only)
#
# Add/remove symbols here. No Python code changes are required.

